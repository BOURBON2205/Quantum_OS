name: Kernel build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-os-main/quantum-os-main
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install i386 build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib binutils
      - name: Clean build
        run: make clean
      - name: Compile kernel
        run: make
